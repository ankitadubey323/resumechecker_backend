# Pings the backend every 10 minutes so Render's free instance (which sleeps after
# 15 minutes without traffic) stays awake.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          # Override with a repository variable BACKEND_URL if the URL changes.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://resumechecker-backend-rzku.onrender.com' }}
        run: |
          # --max-time 120: a sleeping instance can take ~50s to wake up.
          curl --fail --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$BACKEND_URL/health"
